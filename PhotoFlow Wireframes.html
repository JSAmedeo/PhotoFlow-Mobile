<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>PhotoFlow Mobile — Wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
:root{
  --paper:#f3efe7;
  --paper-2:#ebe6db;
  --ink:#1a1a1a;
  --ink-2:#3a3a3a;
  --ink-3:#6a6a6a;
  --ink-4:#a9a39a;
  --grid:#ded7c8;
  --accent:#0ea5b0;
  --accent-ink:#0a6268;
  --sticky:#fff1a8;
  --sticky-2:#cfe8a2;
  --sticky-3:#f7c9b5;
  --danger:#c2410c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Mono",monospace}
body{
  background-image:
    radial-gradient(circle at 18% 12%, rgba(0,0,0,.04) 0 1px, transparent 1px),
    radial-gradient(circle at 72% 38%, rgba(0,0,0,.035) 0 1px, transparent 1px),
    radial-gradient(circle at 42% 78%, rgba(0,0,0,.03) 0 1px, transparent 1px),
    linear-gradient(var(--paper),var(--paper));
  background-size: 220px 220px, 180px 180px, 260px 260px, 100% 100%;
  min-height:100vh;
}
.hand{font-family:"Caveat",cursive;font-weight:700}
.kalam{font-family:"Kalam",cursive}
.mono{font-family:"IBM Plex Mono",monospace}
.cyan{color:var(--accent)}
.muted{color:var(--ink-3)}
.hidden{display:none !important}

/* ---------- top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:30;
  background:linear-gradient(var(--paper), rgba(243,239,231,.92));
  backdrop-filter:blur(6px);
  border-bottom:1px dashed #bfb7a4;
  padding:14px 22px 10px;
}
.topbar-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-family:"Caveat",cursive;font-weight:700;font-size:34px;margin:0;letter-spacing:.5px}
.brand small{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{
  font-family:"Caveat",cursive;font-weight:700;font-size:20px;
  background:transparent;border:1.5px solid transparent;border-radius:999px 3px 999px 3px;
  padding:4px 14px 3px;color:var(--ink-2);cursor:pointer;
}
.tab:hover{border-color:#cfc7b2}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);transform:rotate(-.6deg)}

/* ---------- layout ---------- */
.page{max-width:1680px;margin:0 auto;padding:28px 22px 140px}
.intro{
  display:grid;grid-template-columns:1.3fr .9fr;gap:22px;margin-bottom:26px;
}
.intro h2{font-family:"Caveat",cursive;font-weight:700;font-size:42px;margin:0 0 6px;line-height:1}
.intro p{font-family:"Kalam",cursive;font-size:16px;line-height:1.45;margin:.2em 0;color:var(--ink-2)}
.legend{
  border:1.5px dashed var(--ink-3);padding:14px 16px;border-radius:4px;background:rgba(255,255,255,.35);
}
.legend h3{margin:0 0 8px;font-family:"Caveat",cursive;font-size:22px;font-weight:700}
.legend ul{margin:0;padding-left:16px;font-size:12px;line-height:1.7}
.legend li{list-style:none;position:relative;padding-left:18px;margin-bottom:2px}
.legend li::before{content:"";position:absolute;left:0;top:6px;width:10px;height:10px;border:1.4px solid var(--ink)}
.legend li.active::before{background:var(--accent);border-color:var(--accent-ink)}
.legend li.muted-dot::before{background:#d9d2c0;border-color:#bfb7a4}
.legend li.sticky::before{background:var(--sticky);border-color:#c9a900}

/* ---------- variation grid ---------- */
.screen-header{
  display:flex;align-items:baseline;gap:14px;margin:30px 0 14px;
  border-bottom:2px solid var(--ink);padding-bottom:8px;
}
.screen-header .num{
  font-family:"Caveat",cursive;font-weight:700;font-size:42px;line-height:1;
  background:var(--ink);color:var(--paper);padding:2px 12px 0;border-radius:4px;transform:rotate(-2deg);
}
.screen-header h2{font-family:"Caveat",cursive;font-size:36px;margin:0;font-weight:700}
.screen-header .what{font-family:"Kalam",cursive;font-size:15px;color:var(--ink-2);margin-left:auto;max-width:540px;text-align:right}

.variations{
  display:grid;gap:28px 22px;
  grid-template-columns:repeat(2, minmax(0,1fr));
}
.variations.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.var{position:relative;display:flex;flex-direction:column;gap:10px}
.var-label{
  display:flex;align-items:baseline;gap:10px;
  font-family:"Caveat",cursive;font-weight:700;
}
.var-label .badge{
  font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;
  background:var(--ink);color:var(--paper);padding:2px 8px;letter-spacing:.14em;border-radius:2px;
}
.var-label h3{font-size:26px;margin:0;line-height:1}
.var-note{
  font-family:"Kalam",cursive;font-size:14px;line-height:1.4;color:var(--ink-2);
  background:var(--sticky);padding:8px 12px;border-radius:2px;
  box-shadow: 2px 2px 0 rgba(0,0,0,.08);
  transform:rotate(-.4deg);max-width:640px;
}
.var-note.green{background:var(--sticky-2)}
.var-note.peach{background:var(--sticky-3)}

/* ---------- phone frame (landscape) ---------- */
.phone{
  --pw: 780;
  --ph: 370;
  width:100%;aspect-ratio: var(--pw) / var(--ph);
  background:#111;border-radius:38px;padding:10px;
  box-shadow: 0 10px 0 -6px rgba(0,0,0,.06), 0 22px 30px -18px rgba(0,0,0,.35);
  position:relative;
}
.phone::before, .phone::after{
  content:"";position:absolute;top:50%;width:3px;height:42px;background:#2a2a2a;border-radius:2px;transform:translateY(-50%);
}
.phone::before{left:-4px}
.phone::after{right:-4px}
.phone .screen{
  width:100%;height:100%;background:#0d0d0d;border-radius:28px;overflow:hidden;
  position:relative;color:#e8e8e8;font-family:"IBM Plex Mono",monospace;
}
.phone.paper .screen{background:#fafaf6;color:var(--ink)}

/* generic wire primitives (work on dark AND paper screen via currentColor-ish) */
.phone .screen{--wire:#2a2a2a;--wire-2:#1b1b1b;--wire-strong:#3a3a3a;--text:#cfcfcf;--text-dim:#8a8a8a}
.phone.paper .screen{--wire:#c9c3b3;--wire-2:#dcd6c6;--wire-strong:#9a9482;--text:#1a1a1a;--text-dim:#6a6a6a}

.wire-box{border:1px solid var(--wire);border-radius:3px}
.wire-box.strong{border-color:var(--wire-strong)}
.wire-box.dashed{border-style:dashed}
.wire-fill{background:var(--wire-2)}
.wire-fill-2{background:rgba(255,255,255,.04)}
.phone.paper .wire-fill-2{background:rgba(0,0,0,.03)}
.wire-accent{border-color:var(--accent) !important;color:var(--accent)}
.wire-accent-bg{background:rgba(14,165,176,.12);border:1px solid var(--accent);color:var(--accent)}

.stripe{
  background-image: repeating-linear-gradient(45deg, var(--wire) 0 1px, transparent 1px 8px);
}
.xbox{
  position:relative;
}
.xbox::before, .xbox::after{
  content:"";position:absolute;inset:3px;border-top:1px solid var(--wire);
  transform:rotate(-18deg);transform-origin:left top;opacity:.55;
}
.xbox::after{transform:rotate(18deg);transform-origin:right top;inset:3px;border-top:1px solid var(--wire);}

.lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
.val{font-size:11px;color:var(--text)}
.big{font-size:13px;font-weight:600;letter-spacing:.08em}
.huge{font-size:16px;font-weight:700;letter-spacing:.06em}

/* pill / chip */
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border:1px solid var(--wire-strong);border-radius:999px;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent);background:rgba(14,165,176,.1)}
.chip.warn{border-color:var(--danger);color:var(--danger);background:rgba(194,65,12,.1)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);display:inline-block}
.dot.on{background:var(--accent);box-shadow:0 0 0 2px rgba(14,165,176,.25)}
.dot.warn{background:var(--danger)}

/* scribble helpers */
.scribble{
  background-image: repeating-linear-gradient(-45deg, currentColor 0 1px, transparent 1px 5px);
  opacity:.35;
}

/* arrows + labels floating outside phone */
.callout{
  position:absolute;font-family:"Caveat",cursive;font-weight:700;font-size:15px;color:var(--ink-2);
  line-height:1.05;pointer-events:none;
}

/* flow diagram */
.flow{
  background:#fff;border:1.5px dashed var(--ink-3);border-radius:8px;padding:22px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:18px;position:relative;
}
.flow .node{
  border:1.6px solid var(--ink);border-radius:6px;padding:12px;background:var(--paper);
  display:flex;flex-direction:column;gap:6px;min-height:120px;
}
.flow .node h4{margin:0;font-family:"Caveat",cursive;font-size:22px;font-weight:700}
.flow .node p{margin:0;font-family:"Kalam",cursive;font-size:13px;color:var(--ink-2);line-height:1.3}

/* tweaks panel */
.tweaks{
  position:fixed;right:18px;bottom:18px;z-index:60;
  width:260px;background:var(--paper);border:1.6px solid var(--ink);border-radius:8px;
  box-shadow:0 10px 24px -12px rgba(0,0,0,.35);
  padding:14px;font-family:"IBM Plex Mono",monospace;font-size:12px;
  transform:rotate(-.6deg);
}
.tweaks h4{margin:0 0 8px;font-family:"Caveat",cursive;font-weight:700;font-size:24px;line-height:1}
.tweaks .row{display:flex;justify-content:space-between;align-items:center;margin:8px 0;gap:10px}
.tweaks button{
  font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 8px;border:1.2px solid var(--ink);
  background:transparent;cursor:pointer;border-radius:2px;
}
.tweaks button.on{background:var(--ink);color:var(--paper)}
.tweaks .close{position:absolute;top:6px;right:8px;background:none;border:0;cursor:pointer;font-size:18px;line-height:1}

/* rough effect (applied when rough mode on) */
.rough .wire-box{
  border-style:solid;
  box-shadow: 
    inset 1px 0 0 rgba(0,0,0,.05),
    inset -1px 0 0 rgba(0,0,0,.04);
  filter: url(#wobble);
}
.rough .phone{transform: rotate(-.25deg)}

/* SVG sketch frame border */
.sketch-border{position:absolute;inset:-2px;pointer-events:none;border-radius:28px}

/* density */
.compact .phone{--scale:.94}
.airy .var{gap:14px}

@media (max-width:1100px){
  .variations, .variations.three{grid-template-columns:1fr}
  .intro{grid-template-columns:1fr}
}
</style>
</head>
<body>
<!-- SVG filter for a hand-drawn wobble on wireframe borders (used in rough mode) -->
<svg width="0" height="0" style="position:absolute">
  <filter id="wobble">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="3"/>
    <feDisplacementMap in="SourceGraphic" scale="1.2"/>
  </filter>
</svg>

<div id="root"></div>

<script type="text/babel" data-presets="react">

/* ==================== Tweakable defaults ==================== */
const TWEAKS = /*EDITMODE-BEGIN*/{
  "density": "normal",
  "roughMode": false,
  "showAnnotations": true,
  "paperScreens": false
} /*EDITMODE-END*/;

/* ==================== Shared tiny primitives ==================== */
const Row = ({ children, style, ...p }) => <div style={{ display: "flex", alignItems: "center", gap: 6, ...style }} {...p}>{children}</div>;
const Col = ({ children, style, ...p }) => <div style={{ display: "flex", flexDirection: "column", gap: 6, ...style }} {...p}>{children}</div>;

/* Phone frame wrapper (landscape) */
function Phone({ children, paper = false, style = {} }) {
  const cls = ["phone", paper && "paper"].filter(Boolean).join(" ");
  return (
    <div className={cls} style={style}>
      <div className="screen">{children}</div>
    </div>);

}

/* Tiny SVG icons (placeholders) */
const IconBars = ({ s = 12 }) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M2 12 V6 M6 12 V3 M10 12 V7 M14 12 V5" /></svg>;
const IconGear = ({ s = 12 }) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><circle cx="8" cy="8" r="2.5" /><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.2 3.2l1.4 1.4M11.4 11.4l1.4 1.4M3.2 12.8l1.4-1.4M11.4 4.6l1.4-1.4" /></svg>;
const IconCam = ({ s = 14 }) => <svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.4"><rect x="2" y="5" width="16" height="11" rx="1.5" /><circle cx="10" cy="10.5" r="3" /><rect x="7" y="3" width="6" height="2.5" rx="0.5" /></svg>;
const IconScan = ({ s = 14 }) => <svg width={s} height={s} viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M3 6V4h3M14 4h3v2M17 14v2h-3M6 16H3v-2" /><path d="M4 10h12" /></svg>;
const IconWifi = ({ s = 12 }) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M1.5 6.5a9 9 0 0 1 13 0" /><path d="M3.5 9a6.5 6.5 0 0 1 9 0" /><path d="M5.5 11.5a3.5 3.5 0 0 1 5 0" /><circle cx="8" cy="13.5" r=".8" fill="currentColor" /></svg>;
const IconKey = ({ s = 12 }) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3"><rect x="2" y="6" width="12" height="7" rx="1" /><path d="M4 8h1M6.5 8h1M9 8h1M11.5 8h1M4 10.5h8" /></svg>;
const IconFlash = ({ s = 12 }) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.3"><path d="M9 1 3 9h4l-1 6 6-8H8l1-6z" /></svg>;
const IconMenu = ({ s = 12 }) => <svg width={s} height={s} viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.4"><path d="M2 4h12M2 8h12M2 12h12" /></svg>;

/* Placeholder thumbnail */
function Thumb({ active = false, label = "" }) {
  return (
    <div className={"wire-box " + (active ? "wire-accent" : "")} style={{
      flex: "0 0 auto", aspectRatio: "1/1", width: "100%",
      background: active ? "rgba(14,165,176,.12)" : "rgba(255,255,255,.03)",
      position: "relative", overflow: "hidden"
    }}>
      <div className="stripe" style={{ position: "absolute", inset: 2, opacity: .4 }} />
      {label && <div style={{ position: "absolute", bottom: 2, left: 3, fontSize: 7, letterSpacing: ".1em", opacity: .7 }}>{label}</div>}
    </div>);

}

/* Primary photo placeholder */
function PhotoBox({ aspect = "3/2", children, style = {}, accent = false }) {
  return (
    <div className={"wire-box xbox " + (accent ? "wire-accent" : "")} style={{
      aspectRatio: aspect, width: "100%", position: "relative",
      background: accent ? "rgba(14,165,176,.08)" : "rgba(255,255,255,.03)",
      ...style
    }}>
      <div className="stripe" style={{ position: "absolute", inset: 4, opacity: .35 }} />
      {children}
    </div>);

}

/* ======================================================================
   SCREENS — all wireframes live here, keyed by screen + variation
   ====================================================================== */

/* ---------------- SCAN CARD ---------------- */
function ScanA() {// classic: centered viewfinder, top title, bottom CTA
  return (
    <div style={{ position: "absolute", inset: 0, padding: 10, display: "flex", flexDirection: "column", gap: 6 }}>
      <Row style={{ justifyContent: "space-between" }}>
        <Row><IconScan s={12} /><span className="big cyan">PHOTO FLOW</span></Row>
        <Row style={{ gap: 8 }}><IconWifi /><IconGear /></Row>
      </Row>
      <div className="wire-box wire-accent" style={{ padding: "6px 0", textAlign: "center", fontFamily: "IBM Plex Mono", fontSize: 11, letterSpacing: ".2em" }}>SCAN CARD TO START SESSION</div>
      <div style={{ flex: 1, display: "flex", gap: 8, alignItems: "stretch" }}>
        <Col style={{ width: 38, justifyContent: "center", gap: 10 }}>
          <Col style={{ alignItems: "center", gap: 2 }}><IconFlash /><span className="lbl">LIGHT</span></Col>
          <Col style={{ alignItems: "center", gap: 2 }}><IconKey /><span className="lbl">MANUAL</span></Col>
        </Col>
        <div style={{ flex: 1, position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
          <div className="wire-box wire-accent" style={{ width: "70%", aspectRatio: "2/1", position: "relative", background: "rgba(14,165,176,.06)" }}>
            {[[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y], i) =>
            <div key={i} className="wire-box wire-accent" style={{ position: "absolute", width: 14, height: 14, [x ? "right" : "left"]: -2, [y ? "bottom" : "top"]: -2, borderWidth: 2 }} />
            )}
            <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", flexDirection: "column", gap: 4 }}>
              <div className="scribble" style={{ width: 40, height: 12, color: "var(--accent)" }} />
              <span className="lbl">ALIGN CARD</span>
            </div>
          </div>
        </div>
        <Col style={{ width: 44, justifyContent: "space-between", alignItems: "center" }}>
          <div className="wire-box" style={{ width: 28, height: 22 }} />
          <div className="wire-box wire-accent" style={{ width: 34, height: 34, borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center" }}><IconCam s={14} /></div>
        </Col>
      </div>
      <Row style={{ justifyContent: "center" }}>
        <div className="wire-box" style={{ padding: "4px 14px" }}><span className="val">⌨  ENTER MANUALLY</span></div>
      </Row>
    </div>);

}

function ScanB() {// split: camera left, manual entry right — always-visible fallback
  return (
    <div style={{ position: "absolute", inset: 0, padding: 10, display: "flex", flexDirection: "column", gap: 6 }}>
      <Row style={{ justifyContent: "space-between" }}>
        <span className="big cyan">◉ START SESSION</span>
        <Row style={{ gap: 8 }}><span className="chip on"><span className="dot on" />READY</span><IconGear /></Row>
      </Row>
      <div style={{ flex: 1, display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 8 }}>
        <div className="wire-box wire-accent" style={{ position: "relative", background: "rgba(14,165,176,.06)" }}>
          <div style={{ position: "absolute", top: 4, left: 6 }} className="lbl">SCAN</div>
          <div style={{ position: "absolute", inset: "22% 14%" }} className="wire-box wire-accent">
            <div style={{ position: "absolute", top: "50%", left: 0, right: 0, height: 1, background: "var(--accent)", opacity: .7 }} />
          </div>
          <div style={{ position: "absolute", bottom: 6, left: 0, right: 0, textAlign: "center" }} className="lbl">AUTO — POINT AT CARD</div>
        </div>
        <Col style={{ gap: 6 }}>
          <div className="lbl">OR ENTER MANUALLY</div>
          <div className="wire-box" style={{ padding: "8px 10px" }}>
            <div className="lbl">SESSION ID</div>
            <div className="val">_ _ _ _ - _ _ _ _</div>
          </div>
          <div className="wire-box" style={{ padding: "8px 10px" }}>
            <div className="lbl">PHOTOGRAPHER</div>
            <div className="val">select ▾</div>
          </div>
          <div className="wire-box wire-accent" style={{ padding: "6px 10px", textAlign: "center" }}><span className="big cyan">START</span></div>
          <div className="lbl" style={{ marginTop: "auto" }}>RECENT: 8F21-0004 · 8F21-0003</div>
        </Col>
      </div>
    </div>);

}

function ScanC() {// giant viewfinder, min chrome; "novel" — controls float as orbital chips
  return (
    <div style={{ position: "absolute", inset: 0 }}>
      <div className="wire-box wire-accent" style={{ position: "absolute", inset: 8, background: "rgba(14,165,176,.04)" }} />
      {/* floating chips */}
      <div style={{ position: "absolute", top: 12, left: 14 }} className="chip"><IconScan s={10} /> PHOTOFLOW</div>
      <div style={{ position: "absolute", top: 12, right: 14 }} className="chip"><IconGear s={10} /> CONFIG</div>
      <div style={{ position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)" }} className="chip on"><span className="dot on" /> WAITING FOR CARD</div>
      {/* bracket viewfinder full-screen */}
      {[[0, 0], [1, 0], [0, 1], [1, 1]].map(([x, y], i) =>
      <div key={i} className="wire-box wire-accent" style={{ position: "absolute", width: 22, height: 22, [x ? "right" : "left"]: 40, [y ? "bottom" : "top"]: 40, borderWidth: 2, background: "transparent" }} />
      )}

function App() {
  const [tab, setTab] = React.useState(() => localStorage.getItem("pf_tab") || "main");

  const [tweaksOn, setTweaksOn] = React.useState(false);

  React.useEffect(() => {localStorage.setItem("pf_tab", tab);}, [tab]);
  React.useEffect(() => {window.__TW = tw;}, [tw]);

  // edit-mode wiring
  React.useEffect(() => {
    const handler = (e) => {
      if (!e.data || typeof e.data !== "object") return;
      if (e.data.type === "__activate_edit_mode") setTweaksOn(true);
      if (e.data.type === "__deactivate_edit_mode") setTweaksOn(false);
    };
    window.addEventListener("message", handler);
    window.parent.postMessage({ type: "__edit_mode_available" }, "*");
    return () => window.removeEventListener("message", handler);

    // annotations visibility
    document.querySelectorAll(".var-annotation").forEach((el) => {

          }
            {tab === "main" &&
          <div className="intro">
                <div>
                  <h2>The operator's home base</h2>
                  <p>Where field staff spends 90% of the day. Every variation must answer: <em>did my last shot make it in? is the link still healthy? where do I tap to review?</em></p>
                </div>
                <div className="legend"><h3>Now in every variation</h3>
                  <ul>
                    <li>Current-session thumbnails as a left column</li>
                    <li>A prominent "+ NEW SESSION" button → opens Scan Card</li>
                    <li>A session history list — tap any past session to resume adding photos</li>
                    <li>Variations differ in <em>where</em> each of these lives and how much real-estate they get</li>
                  </ul>
                </div>
              </div>
          }
            {tab === "active" &&
          <div className="intro">
                <div>
                  <h2>When the phone is the camera</h2>
                  <p>Native-camera mode. The viewfinder must breathe; controls must not wander into the frame.</p>
                </div>
                <div className="legend"><h3>Dimensions in play</h3>
                  <ul>
                    <li>Controls: left rail, bottom bar, radial, or off-screen</li>
                    <li>Feedback: live-only vs. live+last-shot side-by-side</li>
                    <li>Shutter placement for thumb reach in landscape</li>
                  </ul>
                </div>
              </div>
          }
            {tab === "config" &&
          <div className="intro">
                <div>
                  <h2>Setting up, and staying set up</h2>
                  <p>Most of this is set once per deployment. The question is: should 'config' double as a live status dashboard?</p>
                </div>
                <div className="legend"><h3>Dimensions in play</h3>
                  <ul>
                    <li>Panel layout: multi-column spec, accordion, nav+scroll, or tile dashboard</li>
                    <li>Discoverability vs. target size on small screens</li>
                    <li>Blurring the line between settings and system health</li>
                  </ul>
                </div>
              </div>
          }
            {current && current.variations && <ScreenSection {...current} />}
          </>
        }
      </main>

      <TweaksPanel tw={tw} setTw={setTw} visible={tweaksOn} onClose={() => setTweaksOn(false)} />
    </>);

}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
